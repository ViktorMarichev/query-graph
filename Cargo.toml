[workspace]
default-members = [".", "crates/query-graph-core"]
members         = [".", "crates/query-graph-core"]
resolver        = "2"

[package]
description = "Node.js adapter for the query-graph planner and SQL compilers"
edition     = "2021"
license     = "MIT"
name        = "query_graph"
publish     = false
version     = "1.1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi             = { version = "3.0.0", features = ["serde-json"] }
napi-derive      = "3.0.0"
query-graph-core = { path = "crates/query-graph-core", version = "1.1.1" }
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
